# ============================================================
# DOCKER COMPOSE — ABSA Sentiment Analysis System
# ============================================================
# Usage:
#   docker compose up --build        ← start API + Dashboard
#   docker compose up api            ← API only
#   docker compose up dashboard      ← Dashboard only
#   docker compose down              ← stop everything
#
# Services:
#   api       → http://localhost:8000  (FastAPI + /docs)
#   dashboard → http://localhost:8501  (Streamlit)
# ============================================================

version: "3.9"

services:

  # ── FastAPI Prediction API ────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     runtime
    container_name: absa_api
    ports:
      - "8000:8000"
    volumes:
      - ./absa_models:/app/absa_models   # persist model artifacts
      - ./logs:/app/logs                 # persist prediction logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

  # ── Streamlit Monitoring Dashboard ────────────────────────────
  dashboard:
    build:
      context:    .
      dockerfile: Dockerfile.dashboard
    container_name: absa_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./absa_models:/app/absa_models
      - ./logs:/app/logs
    environment:
      - ABSA_API_URL=http://api:8000   # internal Docker network URL
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
